name: Deploy to GitHub Pages

on:
  # Publishing is an explicit manual action; pushing code must not deploy.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /
          # The hosted API (Supabase Edge Function "api"). Paths are added by
          # the app (/api/...), so this ends at /functions/v1. A repository
          # variable VITE_API_BASE_URL overrides it. Public URL, not a secret.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://mrcnonqrgrumxyvgpfqr.supabase.co/functions/v1' }}

      - name: Pre-render store and app routes
        run: node scripts/spa-routes.mjs dist
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://mrcnonqrgrumxyvgpfqr.supabase.co/functions/v1' }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
