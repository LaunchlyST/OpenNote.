<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Bio links (desknoty.com/B09BT4lv2, desknoty.com/p/<id>) go straight to the
      // server's checked redirect, before any of the site loads: one hop to Amazon.
      // Store pages and app routes are lowercase, so a capital means a bio link.
      (function () {
        var path = location.pathname
        var m = path.match(/^\/(p\/)?([A-Za-z0-9]+(?:-[A-Za-z0-9]+)*)\/?$/)
        if (!m || m[2].length < 2 || m[2].length > 48) return
        if (!m[1] && !/[A-Z]/.test(m[2])) return
        var base = '%VITE_API_BASE_URL%'
        if (base.charAt(0) === '%') base = ''
        location.replace(base.replace(/\/+$/, '') + '/api/p/' + encodeURIComponent(m[2]) + '/redirect')
      })()
    </script>

      rel="stylesheet"

      <script>
      // Restore a deep link that GitHub Pages' 404.html forwarded here.
      ;(function () {
        var r = new URLSearchParams(window.location.search).get('route')
        if (r && r.charAt(0) === '/' && r.charAt(1) !== '/') window.history.replaceState(null, '', r)
      })()
    </script>
    <script>
      // Never run a cached build. GitHub Pages sends every file with
      // max-age=600 and gives us no way to change that, so a refresh can hand
      // back an index.html from the previous release. This compares the build
      // stamped into this HTML with /version.json (fetched past the cache) and
      // forces one fresh load of the current release when they differ.
      ;(function () {
        var BUILD = '%DN_BUILD%'
        if (!BUILD || BUILD.indexOf('%') === 0) return
        var params = new URLSearchParams(window.location.search)
        if (params.get('v') === BUILD) {
          // Already forced a fresh load: tidy the URL back to normal.
          params.delete('v')
          var qs = params.toString()
          window.history.replaceState(null, '', window.location.pathname + (qs ? '?' + qs : '') + window.location.hash)
        }
        function check() {
          fetch('/version.json?t=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : null })
            .then(function (v) {
              if (!v || !v.build || v.build === BUILD) {
                try { sessionStorage.removeItem('dn-build-reload') } catch (e) {}
                return
              }
              try {
                // One attempt per build, so a half-propagated deploy can never loop.
                if (sessionStorage.getItem('dn-build-reload') === v.build) return
                sessionStorage.setItem('dn-build-reload', v.build)
              } catch (e) {}
              var u = new URL(window.location.href)
              u.searchParams.set('v', v.build)
              window.location.replace(u.toString())
            })
            .catch(function () {})
        }
        check()
      })()
    </script>
</head>
  <body>
