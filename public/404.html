<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desknoty — Your calendar, with room to think.</title>
  </head>
  <body>
    <script>
      // GitHub Pages serves this for any path it has no file for (/app,
      // /app/signin, /landing…). Hand the path to the app's index page, which
      // puts it back in the address bar before the router starts.
      var l = window.location
      l.replace('/?route=' + encodeURIComponent(l.pathname + l.search + l.hash))
    </script>
  </body>
</html>
